name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/community_help_test_ci
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_jwt_secret
      REFRESH_SECRET: ci_refresh_secret
      RATE_LIMIT_FAIL_OPEN: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: community_help_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d community_help_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run prisma:generate
        working-directory: backend
      - run: npm run check
        working-directory: backend
      - run: npm run prisma:migrate:deploy
        working-directory: backend
      - run: npm run test:integration:run
        working-directory: backend

  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
        working-directory: mobile-app
      - run: npm run check
        working-directory: mobile-app
